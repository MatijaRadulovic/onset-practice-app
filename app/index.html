<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>onSET Practice</title>
<style>
  :root {
    --bg: #fff; --card: #edf2f7; --border: #9bb7d4; --text: #444;
    --ok: #1a7f37; --ok-bg: #dafbe1; --bad: #b42318; --bad-bg: #fde4e1; --warn: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1e242c; --border: #3b5069; --text: #d5dae0;
            --ok: #56d364; --ok-bg: #12301b; --bad: #ff8e85; --bad-bg: #3a1714; --warn: #fb923c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 1080px; margin: 16px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); padding: 28px 30px; }
  h1, h2 { text-align: center; color: var(--text); margin: 0 0 24px; font-size: 1.25rem; }
  .text { font-size: 1.3rem; line-height: 2.3; }
  .text input {
    font: inherit; font-size: 1.1rem; width: 7.5em; padding: 2px 6px; margin: 0 2px;
    border: 0; border-bottom: 1px solid var(--text); background: var(--bg); color: var(--text);
  }
  .text input:focus { outline: 2px solid var(--border); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; flex-wrap: wrap; gap: 12px; }
  .timer { font-size: 1.6rem; font-variant-numeric: tabular-nums; font-weight: bold; }
  .timer.low { color: var(--warn); }
  button, select {
    font: inherit; padding: 8px 18px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); cursor: pointer; border-radius: 4px;
  }
  button.primary { background: #2b6cb0; color: #fff; border-color: #2b6cb0; font-weight: bold; }
  .center { text-align: center; }
  .score { font-size: 2.4rem; font-weight: bold; text-align: center; margin: 4px 0; }
  .sub { text-align: center; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0 28px; }
  td, th { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; }
  td:nth-child(n+2), th:nth-child(n+2) { text-align: right; }
  .review { margin-top: 24px; }
  .review h3 { margin: 18px 0 8px; }
  .review .text { font-size: 1.05rem; line-height: 2; }
  .gap { white-space: nowrap; }
  .g { padding: 1px 3px; border-radius: 3px; white-space: nowrap; }
  .g.ok { background: var(--ok-bg); color: var(--ok); }
  .g.bad { background: var(--bad-bg); color: var(--bad); }
  .g.bad s { opacity: .8; }
</style>
</head>
<body>
<main><div class="card" id="app"></div></main>
<script>
const params = new URLSearchParams(location.search);
const TIME_LIMIT = parseInt(params.get("secs") || "300", 10); // ?secs=N to shorten for testing

const app = document.getElementById("app");
let exams = [];
let exam = null;          // selected exam
let idx = 0;              // current text index
let results = [];         // [{values: [...], secondsUsed}]
let deadline = 0, tick = null;

const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
};
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
// Split body into text chunks and gaps: "...to t______ legend" -> ["...to ", gap0, " legend"]
const GAP = /([A-Za-z]+)______/g;

function showStart() {
  clearInterval(tick);
  const sel = el("select", { id: "exam" }, ...exams.map(e => el("option", { value: e.id }, `${label(e.id)} (${e.texts.length} texts)`)));
  const go = el("button", { className: "primary", textContent: "Start" });
  go.onclick = () => startExam(exams.find(e => e.id === sel.value));
  app.replaceChildren(
    el("h1", {}, "onSET Practice"),
    el("p", { className: "center" }, `20 gaps per text, ${fmt(TIME_LIMIT)} per text. Type only the missing letters.`),
    el("p", { className: "center" }, sel, " ", go)
  );
}

function startExam(e) {
  exam = e; idx = 0; results = [];
  showText();
}

function showText() {
  const t = exam.texts[idx];
  const inputs = [];
  const body = el("div", { className: "text" });
  let last = 0, m, g = 0;
  GAP.lastIndex = 0;
  while ((m = GAP.exec(t.body))) {
    const inp = el("input", { type: "text", maxLength: 20, autocomplete: "off", spellcheck: false });
    inp.dataset.i = g++;
    inputs.push(inp);
    // stump + input in one nowrap span so they never split across lines
    body.append(t.body.slice(last, m.index), el("span", { className: "gap" }, m[1], inp));
    last = m.index + m[0].length;
  }
  body.append(t.body.slice(last));

  inputs.forEach((inp, i) => {
    inp.addEventListener("keydown", ev => {
      if ((ev.key === " " || ev.key === "Enter") && inputs[i + 1]) {
        ev.preventDefault(); inputs[i + 1].focus();
      } else if (ev.key === "Backspace" && !inp.value && inputs[i - 1]) {
        ev.preventDefault(); inputs[i - 1].focus();
      }
    });
  });

  const timer = el("div", { className: "timer" });
  const done = el("button", { className: "primary", textContent: idx + 1 < exam.texts.length ? "Text completed →" : "Finish" });
  const finish = () => {
    clearInterval(tick);
    results.push({
      values: inputs.map(i => i.value),
      secondsUsed: TIME_LIMIT - Math.max(0, Math.round((deadline - Date.now()) / 1000)),
    });
    idx++;
    idx < exam.texts.length ? showText() : showResults();
  };
  done.onclick = finish;

  app.replaceChildren(
    el("h2", {}, t.title),
    body,
    el("div", { className: "bar" }, el("div", {}, `Text ${idx + 1} of ${exam.texts.length}`), timer, done)
  );
  inputs[0].focus();

  deadline = Date.now() + TIME_LIMIT * 1000;
  const update = () => {
    const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    timer.textContent = fmt(left);
    timer.classList.toggle("low", left <= 60);
    if (left === 0) finish();
  };
  update();
  tick = setInterval(update, 250);
}

const norm = s => s.trim().toLowerCase();
const label = id => id === "exam-original" ? "Original practice test" : id.replace("-", " ").toUpperCase();

function showResults() {
  const rows = [], reviews = [];
  let total = 0, max = 0;
  exam.texts.forEach((t, ti) => {
    const vals = results[ti].values;
    let score = 0;
    const body = el("div", { className: "text" });
    let last = 0, m, g = 0;
    GAP.lastIndex = 0;
    while ((m = GAP.exec(t.body))) {
      const a = t.answers[g], v = vals[g] || "";
      const ok = norm(v) === norm(a.missing);
      if (ok) score++;
      body.append(t.body.slice(last, m.index));
      const span = el("span", { className: "g " + (ok ? "ok" : "bad") }, a.kept + a.missing);
      if (!ok && v.trim()) span.append(" (", el("s", {}, a.kept + v.trim()), ")");
      body.append(span);
      last = m.index + m[0].length; g++;
    }
    body.append(t.body.slice(last));
    total += score; max += t.answers.length;
    rows.push(el("tr", {}, el("td", {}, `${t.n}. ${t.title}`), el("td", {}, `${score} / ${t.answers.length}`), el("td", {}, fmt(results[ti].secondsUsed))));
    reviews.push(el("h3", {}, `${t.n}. ${t.title} — ${score} / ${t.answers.length}`), body);
  });
  const pct = Math.round((total / max) * 100);
  const again = el("button", { className: "primary", textContent: "Try another exam" });
  again.onclick = showStart;
  app.replaceChildren(
    el("h1", {}, `Results — ${label(exam.id)}`),
    el("div", { className: "score" }, `${total} / ${max}`),
    el("div", { className: "sub" }, `${pct}%`),
    el("table", {}, el("tr", {}, el("th", {}, "Text"), el("th", {}, "Score"), el("th", {}, "Time")), ...rows),
    el("div", { className: "center" }, again),
    el("div", { className: "review" }, el("h2", {}, "Review (green = correct, red = wrong with your answer struck through)"), ...reviews)
  );
  window.scrollTo(0, 0);
}

fetch("/api/exams").then(r => r.json()).then(d => { exams = d; showStart(); })
  .catch(e => app.textContent = "Could not load exams: " + e);
</script>
</body>
</html>
